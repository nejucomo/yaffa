[workspace]
resolver = "3"
members = [
  "yaffa",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT"
repository = "https://github.com/nejucomo/yaffa"

[workspace.metadata.crane]
name = "yaffa-workspace"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.dependencies]
clap = "4.6.7"
color-eyre = "0.6.5"
